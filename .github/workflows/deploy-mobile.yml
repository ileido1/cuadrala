# Despliegue de la app web a Vercel.
#
# Flutter no viene en las imágenes de Vercel y `build/` está en .gitignore, así
# que Vercel no puede construir la app por su cuenta. Acá se construye —donde
# Flutter sí está soportado— y a Vercel se le entrega el resultado ya compilado
# con `--prebuilt`. Vercel hace lo que hace bien: servir estáticos.
#
# La ventaja real sobre dejar que Vercel construya: los tests corren ANTES de
# publicar. Un build que compila con la suite en rojo no llega a producción.
name: Desplegar app web

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  # Para poder republicar sin tocar código.
  workflow_dispatch:

concurrency:
  # Un push nuevo cancela el deploy anterior: publicar una versión vieja encima
  # de una nueva es peor que tardar un minuto más.
  group: deploy-mobile
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7
        with:
          # Clone completo: sentry-cli necesita el historial real para ubicar
          # el commit del release anterior y armar los "suspect commits".
          # Con el shallow clone default (depth=1) tira "Could not find the
          # SHA of the previous release in the git history" apenas hay más
          # de un release registrado.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          # Fijada a la version de desarrollo. `flutter-version-file` no sirve
          # acá: pubspec.yaml declara el SDK de Dart pero no el de Flutter, y un
          # canal flotante haria que el build cambie sin que cambie el codigo.
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze lib test

      - name: Tests
        run: flutter test

      - name: Construir la app web
        # `API_BASE_URL` NO tiene default util en el codigo: cuando falta, la app
        # cae en http://localhost:4000 y en produccion el navegador termina
        # buscando un servidor en la maquina del usuario. Sin este dart-define el
        # build compila igual y falla recien al abrirlo.
        #
        # Se puede sobrescribir con la variable de repositorio API_BASE_URL para
        # apuntar a otro entorno sin tocar el workflow.
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://cuadrala-api.onrender.com' }}
          # DSN de Sentry (proyecto cuadrala-mobile, org uma-ax): no es secreto,
          # es la clave pública que usa el SDK para enviar eventos.
          SENTRY_DSN: ${{ vars.SENTRY_DSN || 'https://433d0c6001593f52435df876d98ed5b0@o4512408230166528.ingest.us.sentry.io/4512408308023296' }}
          # Opcional: sin esto la app funciona, pero el login con Google no.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          # Firebase Web/VAPID are public browser configuration, never service-account credentials.
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_PROJECT_ID: ${{ vars.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_STORAGE_BUCKET: ${{ vars.FIREBASE_WEB_STORAGE_BUCKET }}
          FIREBASE_WEB_VAPID_KEY: ${{ vars.FIREBASE_WEB_VAPID_KEY }}
        run: |
          flutter build web --release --source-maps \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_WEB_MESSAGING_SENDER_ID="$FIREBASE_WEB_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_WEB_PROJECT_ID="$FIREBASE_WEB_PROJECT_ID" \
            --dart-define=FIREBASE_WEB_AUTH_DOMAIN="$FIREBASE_WEB_AUTH_DOMAIN" \
            --dart-define=FIREBASE_WEB_STORAGE_BUCKET="$FIREBASE_WEB_STORAGE_BUCKET" \
            --dart-define=FIREBASE_WEB_VAPID_KEY="$FIREBASE_WEB_VAPID_KEY"
          node <<'NODE'
          const fs = require('fs');
          const config = {
            apiKey: process.env.FIREBASE_WEB_API_KEY,
            appId: process.env.FIREBASE_WEB_APP_ID,
            messagingSenderId: process.env.FIREBASE_WEB_MESSAGING_SENDER_ID,
            projectId: process.env.FIREBASE_WEB_PROJECT_ID,
            authDomain: process.env.FIREBASE_WEB_AUTH_DOMAIN,
            storageBucket: process.env.FIREBASE_WEB_STORAGE_BUCKET,
          };
          const required = ['apiKey', 'appId', 'messagingSenderId', 'projectId'];
          const worker = fs.readFileSync('web/firebase-messaging-sw.js', 'utf8');
          const prefix = required.every((key) => config[key])
            ? `self.__FIREBASE_WEB_CONFIG__ = ${JSON.stringify(config)};\n`
            : '';
          fs.writeFileSync('build/web/firebase-messaging-sw.js', `${prefix}${worker}`);
          NODE

      - name: Subir source maps a Sentry
        # `SENTRY_AUTH_TOKEN` NO está en pubspec.yaml: el plugin invoca
        # sentry-cli, que lee esta variable del entorno solo. Si falta, el
        # upload se salta en silencio (ver auth-token.md) — por eso el paso
        # explícito, en el mismo job que el build, en ese orden.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: dart run sentry_dart_plugin

      - name: Armar la salida para Vercel
        # Build Output API v3: Vercel publica `.vercel/output` tal cual, sin
        # ejecutar ningún build propio.
        run: |
          mkdir -p .vercel/output/static
          cp -r build/web/. .vercel/output/static/
          # En una linea a proposito: un heredoc adentro del YAML no termina,
          # porque su delimitador queda indentado y el shell no lo reconoce.
          # `filesystem` sirve los archivos reales; el resto cae en index.html
          # para que las rutas de go_router funcionen al recargar la pagina.
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/.*","dest":"/index.html"}]}' > .vercel/output/config.json

      - name: Publicar en Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
